[pytest]
# pytest 默认对测试用例名称进行转义，这里关闭，防止中文名称报错
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

addopts = -vs

testpaths = ./other  # 测试用例目录

python_files = test_*.py # 约定测试用例文件名称开头，可以改变

python_classes = Test* # 约定测试类名称，例如TestClass01

python_functions = test_* # 测试方法名称，例如test_01_add

# 注册自定义标记
markers =
    last
    first
    second
    P1
    P2